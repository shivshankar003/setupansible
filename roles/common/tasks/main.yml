---
- name: Get Ansible controller clock
  ansible.builtin.set_fact:
    controller_epoch: "{{ lookup('pipe', 'date +%s') | int }}"

- name: Read Raspberry Pi system clock
  ansible.builtin.command:
    cmd: date +%s
  register: raspberrypi_epoch
  changed_when: false

- name: Correct Raspberry Pi clock when drift exceeds 60 seconds
  ansible.builtin.command:
    cmd: "date -u -s @{{ controller_epoch }}"
  when:
    - (((controller_epoch | int) - (raspberrypi_epoch.stdout | int)) | abs) > 60
  changed_when: true

- name: Re-enable network time synchronization
  ansible.builtin.command:
    cmd: timedatectl set-ntp true
  changed_when: false
  failed_when: false

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install WPU system dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-dev
      - python3-picamera2
      - python3-gi
      - gir1.2-gtk-4.0
      - libgtk-4-1
      - libgl1
      - libglib2.0-0
      - libcap-dev
      - gstreamer1.0-tools
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-ugly
    state: present
