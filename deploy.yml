---
- name: Deploy WPU Client to Raspberry Pi
  hosts: raspberrypi
  become: true

  vars:
    # New/current WPU project on the VM
    local_project: "/media/sf_clean-wpu"

    # Deployment location on Raspberry Pi
    remote_project: "/home/dreamvu/amu-wpu1"

    # Raspberry Pi user
    wpu_user: "dreamvu"

  tasks:

    - name: Create deployment directory
      ansible.builtin.file:
        path: "{{ remote_project }}"
        state: directory
        owner: "{{ wpu_user }}"
        group: "{{ wpu_user }}"
        mode: "0755"

    - name: Copy WPU project to Raspberry Pi
      become: false
      ansible.posix.synchronize:
        src: "{{ local_project }}/"
        dest: "{{ remote_project }}/"
        archive: false
        recursive: true
        delete: true
        checksum: true
        rsync_opts:
          - "--exclude=.git/"
          - "--exclude=.venv/"
          - "--exclude=__pycache__/"
          - "--exclude=.pytest_cache/"
          - "--exclude=*.pyc"
          - "--exclude=.DS_Store"
      delegate_to: localhost

    - name: Set project ownership
      ansible.builtin.file:
        path: "{{ remote_project }}"
        owner: "{{ wpu_user }}"
        group: "{{ wpu_user }}"
        recurse: true

    - name: Run WPU setup script
      become: false
      ansible.builtin.command:
        cmd: ./scripts/setup.sh --skip-apt
        chdir: "{{ remote_project }}"
      environment:
        WPU_USER: "{{ wpu_user }}"

  

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start official WPU server
      ansible.builtin.systemd:
        name: slideshow-server.service
        state: started
        enabled: true

    - name: Check WPU service status
      become: false
      ansible.builtin.command:
        cmd: ./scripts/switch-mode.sh status
        chdir: "{{ remote_project }}"
      environment:
        WPU_USER: "{{ wpu_user }}"
      register: wpu_status
      changed_when: false

    - name: Display WPU service status
      ansible.builtin.debug:
        var: wpu_status.stdout_lines
